<template>
    <div class="slds-grid slds-wrap slds-p-left_xx-small page-wrap">
        <!-- Page Header -->
        <ui-posHeader class="slds col slds-size_4-of-4"></ui-posHeader>
        <!-- Left Navigation (3 of 12 columns) -->
        <div class="slds-col slds-size_2-of-12 slds-p-horizontal_medium slds-show_small">
            <ui-posNavigation
                current-page={currentPage}>
            </ui-posNavigation>
            <div class="slds-var-m-vertical_medium">
                <lightning-card>
                    <div slot="title" class="pos-card-title slds-m-top_medium">
                        <span>Alerts</span>
                    </div>
                    <p class="slds-p-horizontal_large slds-var-m-vertical_large">
                        The alerts default to showing all the fails and once they pass they are removed from the list.
                    </p>
                    <div class="slds-grid slds-gutters slds-wrap">
                        <!-- When there are no fails -->
                        <div class="slds-col slds-size_1-of-1">
                            <article class="slds-card slds-card_boundary slds-m-around_small">
                                <div class="slds-card__header slds-grid">
                                    <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                        <div class="slds-media__body">
                                            <h3 class="slds-card__header-title bold">
                                                <span>
                                                No alerts
                                                </span>
                                            </h3>
                                        </div>
                                    </header>
                                </div>
                                <div class="slds-card__body slds-card__body_inner">
                                    <p>All requirements met</p>
                                </div>
                                <div class="slds-card__footer slds-card__footer_inner slds-align_absolute-center">
                                    <div class="slds-align_absolute-center">
                                        <lightning-icon icon-name="utility:success" size="small" class="slds-m-right_x-small"></lightning-icon>
                                        <span>PASS</span>
                                    </div>
                                </div>
                            </article>
                        </div>
                        <!-- Minor (1) Rule -->
                        <div class="slds-col slds-size_1-of-1">
                            <article class="slds-card slds-card_boundary slds-m-around_small">
                                <div class="slds-card__header slds-grid">
                                    <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                        <div class="slds-media__body">
                                            <h3 class="slds-card__header-title bold">
                                                <span>
                                                Minor (1) requires 15 credits
                                                </span>
                                            </h3>
                                        </div>
                                    </header>
                                </div>
                                <div class="slds-card__body slds-card__body_inner">
                                    <p>Your total: 12 credits</p>
                                </div>
                                <div class="slds-card__footer slds-card__footer_inner slds-align_absolute-center">
                                    <div class="slds-align_absolute-center">
                                        <lightning-icon icon-name="utility:warning" size="small" class="slds-m-right_x-small"></lightning-icon>
                                        <span>FAIL</span>
                                    </div>
                                </div>
                            </article>
                        </div>
                        <!-- Option (1) Rule -->
                        <div class="slds-col slds-size_1-of-1">
                            <article class="slds-card slds-card_boundary slds-m-around_small">
                                <div class="slds-card__header slds-grid">
                                    <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                        <div class="slds-media__body">
                                            <h3 class="slds-card__header-title bold">
                                                <span>
                                                Option (1) requires 12 credits
                                                </span>
                                            </h3>
                                        </div>
                                    </header>
                                </div>
                                <div class="slds-card__body slds-card__body_inner">
                                    <p>Your total: 10 credits</p>
                                </div>
                                <div class="slds-card__footer slds-card__footer_inner slds-align_absolute-center">
                                    <div class="slds-align_absolute-center">
                                        <lightning-icon icon-name="utility:warning" size="small" class="slds-m-right_x-small"></lightning-icon>
                                        <span>FIX</span>
                                    </div>
                                </div>
                            </article>
                        </div>
                    </div>
                </lightning-card>
            </div>
        </div>

        <!-- Main Content (8 of 12 columns) -->
        <div class="slds-col slds-size_1-of-1 slds-p-horizontal_medium slds-large-size_10-of-12">
            <slot>
                <div class="slds-card-wrapper slds-var-m-bottom_medium">
                    <lightning-card>
                        <div slot="title" class="pos-card-title">
                            <span>Search and Add Courses</span>
                        </div>
                        <p class="slds-p-horizontal_small slds-var-m-vertical_medium">
                        Search for courses and add them to your course plan with the Choose button. You can search for transfer courses, current courses and those you have already taken at OSU, and future courses you plan to take.
                        </p>
                        <lightning-tabset>
                            <lightning-tab label="1. Transfer courses">
                                <div>
                                    <lightning-input
                                        type="search"
                                        label="Search your transfer courses"
                                        name="transfer-search"
                                        onchange={handleTransferSearch}
                                        class="slds-var-m-bottom_small">
                                    </lightning-input>
                                </div>
                                <template if:true={hasTransferResults}>
                                    <ui-coursePlanDatatable
                                        key-field="id"
                                        data={filteredTransferCourses}
                                        columns={columns}
                                        data-source="transfer"
                                        onplacementchange={handlePlacementChange}
                                        hide-checkbox-column>
                                    </ui-coursePlanDatatable>
                                </template>
                                <template if:false={hasTransferResults}>
                                    <template if:true={hasTransferSearch}>
                                        <p class="slds-p-vertical_small">No matching transfer courses found.</p>
                                    </template>
                                </template>
                            </lightning-tab>
                            <lightning-tab label="2. Current and past courses" title="Current and past courses">
                                <div>
                                    <lightning-input
                                        type="search"
                                        label="Search your OSU transcript"
                                        name="transcript-search"
                                        onchange={handleTranscriptSearch}
                                        class="slds-var-m-bottom_small">
                                    </lightning-input>
                                </div>
                                <template if:true={hasTranscriptResults}>
                                    <ui-coursePlanDatatable
                                        key-field="id"
                                        data={filteredTranscriptCourses}
                                        columns={columns}
                                        data-source="transcript"
                                        onplacementchange={handlePlacementChange}
                                        hide-checkbox-column>
                                    </ui-coursePlanDatatable>
                                </template>
                                <template if:false={hasTranscriptResults}>
                                    <template if:true={hasTranscriptSearch}>
                                        <p class="slds-p-vertical_small">No matching transcript courses found.</p>
                                    </template>
                                </template>
                            </lightning-tab>
                            <lightning-tab label="3. Future courses">
                                <div>
                                    <lightning-input
                                        type="search"
                                        label="Search for future courses"
                                        name="future-search"
                                        onchange={handleFutureSearch}
                                        class="slds-var-m-bottom_small">
                                    </lightning-input>
                                </div>
                                <template if:true={hasFutureResults}>
                                    <ui-coursePlanDatatable
                                        key-field="id"
                                        data={filteredFutureCourses}
                                        columns={columns}
                                        data-source="future"
                                        onplacementchange={handlePlacementChange}
                                        hide-checkbox-column>
                                    </ui-coursePlanDatatable>
                                </template>
                                <template if:false={hasFutureResults}>
                                    <template if:true={hasFutureSearch}>
                                        <p class="slds-p-vertical_small">No matching future courses found.</p>
                                    </template>
                                </template>
                            </lightning-tab>
                        </lightning-tabset>
                    </lightning-card>
                </div>
                <div class="slds-card-wrapper slds-var-m-bottom_medium">
                    <lightning-card>
                        <div slot="title" class="pos-card-title">
                            <span>Course Plan</span>
                        </div>  
                        <section>
                            <div>
                                <p class="slds-text-heading_small slds-p-vertical_small slds-p-horizontal_small">{totalCreditsAdded} out of {requiredCredits.total} total required credits added</p>
                            </div>
                        </section>
                        <section class="slds-card slds-card_boundary">
                            <div class="slds-card__header slds-grid">
                                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                    <div class="slds-media__body">
                                        <h3 class="slds-card__header-title">
                                            <span class="slds-truncate">
                                            Major Courses
                                            </span>
                                        </h3>
                                        <p class="slds-text-heading_small slds-p-vertical_small">{majorCreditsAdded} out of {requiredCredits.major} required credits added</p>
                                    </div>
                                </header>
                            </div>
                            <div class="slds-card__body slds-card__body_inner">
                                <div style="min-height: 125px;">
                                    <ui-coursePlanDatatable
                                        key-field="id"
                                        default-sort-direction="asc"
                                        show-row-number-column="true"
                                        hide-checkbox-column
                                        data={majorCourses}
                                        columns={planColumns}
                                        data-source="major"
                                        onplacementchange={handlePlacementChange}
                                        onrowaction={handlePlanRowAction}>
                                    </ui-coursePlanDatatable>
                                </div>
                            </div>
                        </section>
                        <section class="slds-card slds-card_boundary">
                            <div class="slds-card__header slds-grid">
                                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                    <div class="slds-media__body">
                                        <h3 class="slds-card__header-title">
                                            <span class="slds-truncate">
                                            Option Courses
                                            </span>
                                        </h3>
                                        <p class="slds-text-heading_small slds-p-vertical_small">{optionCreditsAdded} out of {requiredCredits.option} required credits added</p>
                                    </div>
                                </header>
                            </div>
                            <div class="slds-card__body slds-card__body_inner">
                                <div style="min-height: 125px;">
                                    <ui-coursePlanDatatable
                                        key-field="id"
                                        default-sort-direction="asc"
                                        show-row-number-column="true"
                                        data={optionCourses}
                                        columns={planColumns}
                                        data-source="option"
                                        onplacementchange={handlePlacementChange}
                                        onrowaction={handlePlanRowAction}>
                                    </ui-coursePlanDatatable>
                                </div>
                            </div>
                        </section>
                        <section class="slds-card slds-card_boundary">
                            <div class="slds-card__header slds-grid">
                                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                    <div class="slds-media__body">
                                        <h3 class="slds-card__header-title">
                                            <span class="slds-truncate">
                                            Minor Courses
                                            </span>
                                        </h3>
                                        <p class="slds-text-heading_small slds-p-vertical_small">{minorCreditsAdded} out of {requiredCredits.minor} required credits added</p>
                                    </div>
                                </header>
                            </div>
                            <div class="slds-card__body slds-card__body_inner">
                                <div style="min-height: 125px;">
                                    <ui-coursePlanDatatable
                                        key-field="id"
                                        default-sort-direction="asc"
                                        show-row-number-column="true"
                                        data={minorCourses}
                                        columns={planColumns}
                                        data-source="minor"
                                        onplacementchange={handlePlacementChange}
                                        onrowaction={handlePlanRowAction}>
                                    </ui-coursePlanDatatable>
                                </div>
                            </div>
                        </section>
                        <section class="slds-card slds-card_boundary">
                            <div class="slds-card__header slds-grid">
                                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                    <div class="slds-media__body">
                                        <h3 class="slds-card__header-title">
                                            <span class="slds-truncate">
                                            Thesis (Capstone) Courses
                                            </span>
                                        </h3>
                                        <p class="slds-text-heading_small slds-p-vertical_small">{thesisCreditsAdded} out of {requiredCredits.thesis} required credits added</p>
                                    </div>
                                </header>
                            </div>
                            <div class="slds-card__body slds-card__body_inner">
                                <div style="min-height: 125px;">
                                    <ui-coursePlanDatatable
                                        key-field="id"
                                        default-sort-direction="asc"
                                        show-row-number-column="true"
                                        data={thesisCourses}
                                        columns={planColumns}
                                        data-source="thesis"
                                        onplacementchange={handlePlacementChange}
                                        onrowaction={handlePlanRowAction}>
                                    </ui-coursePlanDatatable>
                                </div>
                            </div>
                        </section>
                    
                        <section class="slds-var-m-top_large">
                            <button class="slds-button slds-button_neutral slds-m-right_small">Back</button>
                            <button class="slds-button slds-button_brand">Continue</button>
                        </section>
                    </lightning-card>
                </div>
            </slot>
        </div>
    </div>
</template>
