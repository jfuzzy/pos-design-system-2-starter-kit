<template>
    <div class="slds-grid slds-wrap slds-p-left_xx-small page-wrap">
        <!-- Page Header -->
        <ui-posHeader class="slds col slds-size_4-of-4"></ui-posHeader>
        <!-- Left Navigation (4 of 16 columns) -->
        <div class="slds-col slds-size_1-of-4 slds-p-horizontal_medium slds-show_small">
            <ui-posNavigation
                current-page={currentPage}>
            </ui-posNavigation>
        </div>

        <!-- Main Content (8 of 12 columns) -->
        <div class="slds-col slds-size_1-of-1 slds-p-horizontal_medium slds-large-size_8-of-12">
            <slot>
                <div class="slds-card-wrapper">
                    <lightning-card>
                        <div slot="title" class="pos-card-title">
                            <span>Overview</span>
                        </div>
                        <p class="slds-p-horizontal_small slds-var-m-vertical_medium">
                        Review and update your program information
                        </p>
                    </lightning-card>
                    <section class="slds-card slds-card_boundary">
                        <div class="slds-card__header slds-grid">
                            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                <div class="slds-media__body">
                                    <h3 class="slds-card__header-title">
                                        <span class="slds-truncate">
                                        Program Information
                                        </span>
                                    </h3>
                                </div>
                            </header>
                        </div>
                        <div class="slds-card__body slds-card__body_inner">
                        <lightning-combobox
                            label="Major"
                            value={selectedMajor}
                            options={majorOptions}
                            data-field="major"
                            onchange={handleProgramSelectionChange}>
                        </lightning-combobox>
                        <lightning-combobox
                            label="Degree"
                            value={selectedDegree}
                            options={degreeOptions}
                            data-field="degree"
                            onchange={handleProgramSelectionChange}>
                        </lightning-combobox>
                        <p><strong>Campus:</strong> Corvallis</p>
                        </div>
                    </section>
                    <section class="slds-card slds-card_boundary">
                        <div class="slds-card__header slds-grid">
                            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                <div class="slds-media__body">
                                    <h3 class="slds-card__header-title">
                                        <span class="slds-truncate">
                                        Thesis/Non-thesis
                                        </span>
                                    </h3>
                                </div>
                            </header>
                        </div>
                        <div class="slds-card__body slds-card__body_inner">
                            <lightning-combobox
                                class="slds-var-m-vertical_medium"
                                label="Choose thesis or non-thesis"
                                value={selectedThesisMode}
                                options={thesisModeOptions}
                                data-field="thesisMode"
                                onchange={handleProgramSelectionChange}>
                            </lightning-combobox>
                            <div class="slds-form-element slds-var-m-vertical_small">
                                <div class="slds-form-element__control">
                                    <label class="slds-checkbox_toggle slds-grid" for="checkbox-toggle-124" part="checkbox-toggle">
                                        <span class="slds-form-element__label">Capstone or Research Project</span>
                                        <input type="checkbox" part="checkbox" role="switch" id="checkbox-toggle-124" name="input1" value="" aria-describedby="help-message-124">
                                        <span data-toggle-description="" class="slds-checkbox_faux_container" id="toggle-description-124">
                                            <span class="slds-checkbox_faux" part="indicator"></span> 
                                        </span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </section>
                    <section class="slds-card slds-card_boundary">
                        <div class="slds-card__header slds-grid">
                            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                <div class="slds-media__body">
                                    <h3 class="slds-card__header-title">
                                        <span class="slds-truncate">
                                        Minor
                                        </span>
                                    </h3>
                                </div>
                            </header>
                        </div>
                        <div class="slds-card__body slds-card__body_inner">
                            <lightning-combobox
                                class="slds-var-m-bottom_small"
                                label="Choose first minor"
                                value={selectedMinor1}
                                options={minorOptions}
                                data-field="minor1"
                                onchange={handleProgramSelectionChange}>
                            </lightning-combobox>
                            <lightning-combobox
                                class="slds-var-m-bottom_small"
                                label="Choose second minor"
                                value={selectedMinor2}
                                options={minorOptions}
                                data-field="minor2"
                                onchange={handleProgramSelectionChange}>
                            </lightning-combobox>
                        </div>
                    </section>
                    <section class="slds-card slds-card_boundary">
                        <div class="slds-card__header slds-grid">
                            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                <div class="slds-media__body">
                                    <h3 class="slds-card__header-title">
                                        <span class="slds-truncate">
                                        Options
                                        </span>
                                    </h3>
                                </div>
                            </header>
                        </div>
                        <div class="slds-card__body slds-card__body_inner">
                            <lightning-combobox
                                class="slds-var-m-bottom_small"
                                label="Choose first option"
                                value={selectedOption1}
                                options={optionOptions}
                                data-field="option1"
                                onchange={handleProgramSelectionChange}>
                            </lightning-combobox>
                            <lightning-combobox
                                class="slds-var-m-bottom_small"
                                label="Choose second option"
                                value={selectedOption2}
                                options={optionOptions}
                                data-field="option2"
                                onchange={handleProgramSelectionChange}>
                            </lightning-combobox>
                        </div>
                    </section>
                    <section class="slds-var-m-top_large">
                        <button class="slds-button slds-button_brand">Continue</button>
                    </section>
                </div>
            </slot>
        </div>
    </div>
</template>
