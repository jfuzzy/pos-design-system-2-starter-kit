<template>
    <div class="slds-grid slds-wrap slds-p-left_xx-small page-wrap">
        <!-- Page Header -->
        <ui-posHeader class="slds col slds-size_4-of-4"></ui-posHeader>
        <!-- Left Navigation (3 of 12 columns) -->
        <div class="slds-col slds-size_1-of-4 slds-p-horizontal_medium slds-show_small">
            <ui-posNavigation
                current-page={currentPage}>
            </ui-posNavigation>
        </div>

        <!-- Main Content (8 of 12 columns) -->
        <div class="slds-col slds-size_1-of-1 slds-p-horizontal_medium slds-large-size_8-of-12">
            <slot>
                <div class="slds-card-wrapper slds-var-m-vertical_medium">
                    <lightning-card>
                        <div slot="title" class="pos-card-title">
                            <span>Review and Submit</span>
                        </div>
                        <p class="slds-p-horizontal_small slds-var-m-vertical_medium bold">Review all sections before submitting. </p>
                        <p class="slds-p-horizontal_small slds-var-m-vertical_medium">
                            Click Preview to generate a PDF you can share with your committee or advisor. When you are ready to submit your program of study, click Submit. You will then sign the submission and it will route for additional signatures.
                        </p>
                    </lightning-card>
                </div>
                <div class="slds-card-wrapper slds-var-m-vertical_medium">
                    <lightning-card>
                        <div class="slds-grid slds-gutters">
                            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-4">
                                <article class="slds-card slds-card_boundary">
                                    <div class="slds-card__header slds-grid">
                                        <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                            <div class="slds-media__body">
                                                <h2 class="slds-card__header-title slds-align_absolute-center">
                                                <a href={overviewHref} data-id="overview" onclick={handleCardLinkClick} class="slds-card__header-link slds-truncate bold" title="Overview">
                                                    <span>
                                                    Overview
                                                    </span>
                                                </a>
                                                </h2>
                                            </div>
                                        </header>
                                    </div>
                                    <div class="slds-card__body slds-card__body_inner">
                                        <div class="slds-m-bottom_medium slds-align_absolute-center">
                                            <lightning-icon icon-name="utility:info" size="small"></lightning-icon>
                                        </div>
                                        <div class="slds-align_absolute-center">
                                            <p>REVIEW</p>
                                        </div>
                                    </div>
                                </article>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-4">
                                <article class="slds-card slds-card_boundary">
                                    <div class="slds-card__header slds-grid">
                                        <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                            <div class="slds-media__body">
                                                <h2 class="slds-card__header-title slds-align_absolute-center">
                                                <a href={coursePlanHref} data-id="coursePlanSingle" onclick={handleCardLinkClick} class="slds-card__header-link slds-truncate bold" title="Overview">
                                                    <span>
                                                    Course Plan
                                                    </span>
                                                </a>
                                                </h2>
                                            </div>
                                        </header>
                                    </div>
                                    <div class="slds-card__body slds-card__body_inner">
                                        <div class="slds-m-bottom_medium slds-align_absolute-center">
                                            <lightning-icon icon-name="utility:error" size="small"></lightning-icon>
                                        </div>
                                        <div class="slds-align_absolute-center">
                                            <p>FIX</p>
                                        </div>
                                    </div>
                                </article>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-4">
                                <article class="slds-card slds-card_boundary">
                                    <div class="slds-card__header slds-grid">
                                        <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                            <div class="slds-media__body">
                                                <h2 class="slds-card__header-title slds-align_absolute-center">
                                                <a href={committeeHref} data-id="committee" onclick={handleCardLinkClick} class="slds-card__header-link slds-truncate bold" title="Overview">
                                                    <span>
                                                    Committee
                                                    </span>
                                                </a>
                                                </h2>
                                            </div>
                                        </header>
                                    </div>
                                    <div class="slds-card__body slds-card__body_inner">
                                        <div class="slds-m-bottom_medium slds-align_absolute-center">
                                            <lightning-icon icon-name="utility:success" size="small"></lightning-icon>
                                        </div>
                                        <div class="slds-align_absolute-center">
                                            <p>PASS</p>
                                        </div>
                                    </div>
                                </article>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-4">
                                <article class="slds-card slds-card_boundary">
                                    <div class="slds-card__header slds-grid">
                                        <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                            <div class="slds-media__body">
                                                <h2 class="slds-card__header-title slds-align_absolute-center">
                                                <a href={additionalRequirementsHref} data-id="requirements" onclick={handleCardLinkClick} class="slds-card__header-link slds-truncate bold" title="Overview">
                                                    <span>
                                                    Additional Requirements
                                                    </span>
                                                </a>
                                                </h2>
                                            </div>
                                        </header>
                                    </div>
                                    <div class="slds-card__body slds-card__body_inner">
                                        <div class="slds-m-bottom_medium slds-align_absolute-center">
                                            <lightning-icon icon-name="utility:success" size="small"></lightning-icon>
                                        </div>
                                        <div class="slds-align_absolute-center">
                                            <p>PASS</p>
                                        </div>
                                    </div>
                                </article>
                            </div>
                        </div>
                    </lightning-card>
                </div>
                <!-- Buttons for Review and Submit -->
                <div class="slds-card-wrapper">    
                    <lightning-card>
                        <div class="slds-p-horizontal_small slds-var-m-vertical_medium">
                            <button class="slds-button slds-button_neutral slds-m-right_small">Back</button>
                            <button class="slds-button slds-button_neutral slds-m-right_small">Preview</button>
                            <button class="slds-button slds-button_brand">Submit</button>
                        </div>
                    </lightning-card>
                </div>
            </slot>
        </div>
        
    </div>
</template>
